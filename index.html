<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Learning Hub</title>
<style>
  :root { --bg:#0b0f19; --card:#151f32; --card2:#1e293b; --text:#cbd5e1; --head:#f8fafc; --accent:#38bdf8; --ok:#10b981; --muted:#64748b; }
  body { background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,sans-serif; margin:0; padding:15px; line-height:1.5; }
  .container { max-width:1200px; margin:0 auto; padding-bottom:60px; }
  .top { display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid #1e293b; margin-bottom:25px; }
  .top h1 { font-size:1.2rem; color:var(--head); margin:0; }
  .top span { font-size:.85rem; color:var(--muted); }
  .panel { background:linear-gradient(135deg,#1e293b,#0f172a); border-left:5px solid var(--accent); border-radius:12px; padding:20px; margin-bottom:30px; }
  .panel h3 { margin:0 0 8px; color:var(--accent); font-size:1.1rem; }
  .big { font-size:1.15rem; color:var(--head); font-weight:600; margin-bottom:6px; }
  .tip { color:#94a3b8; font-size:.95rem; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:30px; }
  @media (max-width:850px) { .grid { grid-template-columns:1fr; } }
  .col { background:var(--card); border-radius:12px; padding:20px; }
  .col h2 { color:var(--head); font-size:1.25rem; margin:0 0 14px; padding-bottom:10px; border-bottom:2px solid #1e293b; }
  .item { background:var(--card2); padding:14px; border-radius:8px; margin-bottom:12px; }
  .item a { color:var(--head); text-decoration:none; font-weight:600; display:block; margin-bottom:6px; }
  .item a:hover { color:var(--accent); }
  .meta { display:flex; gap:10px; align-items:center; font-size:.8rem; color:#94a3b8; margin-bottom:6px; flex-wrap:wrap; }
  .item .meta a { display:inline; font-weight:400; margin:0; color:#94a3b8; }
  .item .meta a:hover { color:var(--accent); }
  .tag { padding:2px 6px; border-radius:4px; color:#fff; font-weight:700; font-size:.7rem; background:#6366f1; }
  .tag.hn { background:#f97316; }
  .note { color:var(--muted); font-size:.85rem; padding:6px 2px; }
  .done { color:var(--ok); text-align:center; font-size:.9rem; padding-top:6px; }
  button { background:#0f172a; color:var(--text); border:1px solid #334155; border-radius:6px; padding:6px 12px; cursor:pointer; font-size:.8rem; margin-top:10px; }
  button:hover { border-color:var(--accent); color:var(--head); }
  .bar { height:8px; background:#0f172a; border-radius:99px; overflow:hidden; margin:4px 0 16px; }
  .bar div { height:100%; width:0; background:var(--ok); transition:width .3s; }
  .step { display:flex; gap:10px; align-items:flex-start; background:var(--card2); padding:12px; border-radius:8px; margin-bottom:10px; }
  .step input { margin-top:5px; accent-color:#10b981; }
  .step.checked .st { text-decoration:line-through; color:var(--muted); }
  .st { color:var(--head); font-weight:600; }
  .step p { margin:2px 0 4px; font-size:.9rem; color:#94a3b8; }
  .step a { color:var(--accent); font-size:.85rem; margin-right:12px; }
</style>
</head>
<body>
<div class="container">
  <div class="top"><h1>🤖 AI Learning Hub</h1><span id="today"></span></div>

  <section class="panel">
    <h3>💡 Agent use case of the day</h3>
    <div class="big" id="uc-title">Loading...</div>
    <div id="uc-what"></div>
    <div class="tip" id="uc-tip" style="margin-top:6px;"></div>
    <button id="uc-next" type="button">Show another idea</button>
  </section>

  <main class="grid">
    <div class="col">
      <h2>📰 Latest from AI labs &amp; blogs</h2>
      <div id="news"><div class="note">Loading...</div></div>
    </div>
    <div class="col">
      <h2>🔥 Hacker News (last 3 days)</h2>
      <div id="hn"><div class="note">Loading...</div></div>
    </div>
  </main>

  <section class="col">
    <h2>🎓 Learn to build AI agents</h2>
    <div id="path-count" class="note"></div>
    <div class="bar"><div id="path-bar"></div></div>
    <div id="path"></div>
  </section>
</div>

<script>
function el(tag, cls, text) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
function link(text, href) {
  var a = el('a', '', text);
  a.href = href; a.target = '_blank'; a.rel = 'noopener';
  return a;
}
function fetchJson(url, ms) {
  var timeout = new Promise(function (_, rej) { setTimeout(function () { rej(new Error('timeout')); }, ms || 12000); });
  var req = fetch(url).then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
  return Promise.race([req, timeout]);
}
function ageLabel(ms) {
  var h = Math.max(1, Math.round(ms / 3600000));
  return h < 48 ? h + 'h ago' : Math.round(h / 24) + 'd ago';
}
function dayNumber() { return Math.floor((Date.now() - new Date().getTimezoneOffset() * 60000) / 86400000); }
document.getElementById('today').textContent = new Date().toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long' });

// ---------- use case of the day ----------
var USE_CASES = [
  ["Inbox triage agent", "Reads new email, labels it, drafts replies for routine messages and flags what needs you.", "Design tip: let it draft, never send. A human click keeps mistakes cheap."],
  ["Research assistant", "Splits a question into sub-questions, searches, reads sources and writes a short cited brief.", "Design tip: require a source for every claim so you can verify quickly."],
  ["Customer support agent", "Looks up orders and policies, answers common questions and hands off to a person when unsure.", "Design tip: define clear escalation rules (refunds, anger, low confidence) before launch."],
  ["Code review helper", "Reads a diff, runs tests and linters, and comments on bugs, risks and missing tests.", "Design tip: let it use test results as feedback. Agents improve fastest with a checkable signal."],
  ["Data analyst", "Turns plain-English questions into SQL or Python, runs them and explains the chart.", "Design tip: give it read-only database access and show the query it ran."],
  ["Meeting notes to tasks", "Turns a transcript into a summary, decisions and action items with owners.", "Design tip: keep the output format fixed (JSON or a template) so tasks can flow into other tools."],
  ["Study buddy", "Builds quizzes and flashcards from your notes and revisits what you got wrong.", "Design tip: store results so it can space out the questions you miss."],
  ["Personal finance categoriser", "Sorts bank statements into categories and flags unusual charges.", "Design tip: run it on local files and keep the data private."],
  ["Lead research assistant", "Gathers public facts about a company and drafts outreach for a person to review.", "Design tip: separate facts (with sources) from the writing so you can check them."],
  ["Document Q&A (RAG)", "Answers questions over your PDFs and notes with page-level citations.", "Design tip: evaluate retrieval separately from answers. Most failures are retrieval failures."],
  ["On-call incident triage", "Reads an alert, checks logs and dashboards, and proposes next steps from a runbook.", "Design tip: start read-only. Add actions one at a time, each with approval."],
  ["Content repurposing", "Turns a long video or article into a summary, a thread and a newsletter draft.", "Design tip: give it 2 or 3 examples of your own writing so the style matches."]
];
var ucIndex = dayNumber() % USE_CASES.length;
function showUseCase() {
  var u = USE_CASES[ucIndex];
  document.getElementById('uc-title').textContent = u[0];
  document.getElementById('uc-what').textContent = u[1];
  document.getElementById('uc-tip').textContent = u[2];
}
document.getElementById('uc-next').addEventListener('click', function () { ucIndex = (ucIndex + 1) % USE_CASES.length; showUseCase(); });
showUseCase();

// ---------- learning path (progress saved on this device) ----------
var PATH = [
  ["Know when to build an agent", "Workflows vs agents, and the simple patterns that work in production.", [["Building effective agents", "https://www.anthropic.com/research/building-effective-agents"]]],
  ["Learn tool use", "How a model calls functions you define and uses the results.", [["Claude docs", "https://docs.claude.com"]]],
  ["Design tools and context", "Good tool design and managing what the model sees.", [["Context engineering", "https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents"], ["Writing tools for agents", "https://www.anthropic.com/engineering/writing-tools-for-agents"]]],
  ["Build a tiny agent loop yourself", "A working code-editing agent in under 400 lines, no framework.", [["How to Build an Agent", "https://ampcode.com/how-to-build-an-agent"]]],
  ["Connect tools with MCP", "A standard way to plug tools and data sources into agents.", [["Model Context Protocol", "https://modelcontextprotocol.io"]]],
  ["Take a structured course", "Guided lessons with exercises.", [["Hugging Face Agents Course", "https://huggingface.co/learn/agents-course"], ["DeepLearning.AI short courses", "https://www.deeplearning.ai/short-courses/"]]],
  ["Understand multi-agent trade-offs", "What parallel sub-agents gain and what they cost.", [["Multi-agent research system", "https://www.anthropic.com/engineering/multi-agent-research-system"]]],
  ["Study working examples", "Read and run real code, then change it.", [["Anthropic Cookbook", "https://github.com/anthropics/anthropic-cookbook"]]]
];
var PATH_KEY = 'ai_hub_path_v1';
var pathDone = {};
try { pathDone = JSON.parse(localStorage.getItem(PATH_KEY)) || {}; } catch (e) {}
function updateProgress() {
  var n = PATH.filter(function (_, i) { return pathDone[i]; }).length;
  document.getElementById('path-count').textContent = n + ' of ' + PATH.length + ' steps done';
  document.getElementById('path-bar').style.width = (100 * n / PATH.length) + '%';
}
PATH.forEach(function (p, i) {
  var row = el('label', 'step' + (pathDone[i] ? ' checked' : ''));
  var cb = document.createElement('input');
  cb.type = 'checkbox'; cb.checked = !!pathDone[i];
  cb.addEventListener('change', function () {
    pathDone[i] = cb.checked;
    row.className = 'step' + (cb.checked ? ' checked' : '');
    try { localStorage.setItem(PATH_KEY, JSON.stringify(pathDone)); } catch (e) {}
    updateProgress();
  });
  var body = el('div');
  body.appendChild(el('div', 'st', (i + 1) + '. ' + p[0]));
  body.appendChild(el('p', '', p[1]));
  p[2].forEach(function (l) { body.appendChild(link(l[0] + ' ↗', l[1])); });
  row.appendChild(cb); row.appendChild(body);
  document.getElementById('path').appendChild(row);
});
updateProgress();

// ---------- news from blogs (RSS via rss2json) ----------
var SOURCES = [
  { name: 'OpenAI', url: 'https://openai.com/news/rss.xml' },
  { name: 'Hugging Face', url: 'https://huggingface.co/blog/feed.xml' },
  { name: 'Simon Willison', url: 'https://simonwillison.net/atom/everything/' },
  { name: 'Latent Space', url: 'https://www.latent.space/feed' }
];
function parseUtc(s) { return new Date(s.replace(' ', 'T') + 'Z').getTime(); }

function loadNews() {
  var box = document.getElementById('news');
  var failed = [];
  Promise.all(SOURCES.map(function (src) {
    return fetchJson('https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent(src.url))
      .then(function (j) {
        if (!j || j.status !== 'ok' || !j.items) throw new Error(j && j.message ? j.message : 'bad response');
        return j.items.slice(0, 3).map(function (it) { return { src: src.name, title: it.title, link: it.link, ts: parseUtc(it.pubDate) }; });
      })
      .catch(function (err) { console.error('News error for ' + src.name + ':', err); failed.push(src.name); return []; });
  })).then(function (lists) {
    var all = [].concat.apply([], lists).filter(function (x) { return !isNaN(x.ts); }).sort(function (a, b) { return b.ts - a.ts; }).slice(0, 10);
    box.innerHTML = '';
    if (!all.length) box.appendChild(el('div', 'note', 'Could not load any blogs right now.'));
    all.forEach(function (x) {
      var card = el('div', 'item');
      var meta = el('div', 'meta');
      meta.appendChild(el('span', 'tag', x.src));
      meta.appendChild(el('span', '', ageLabel(Date.now() - x.ts)));
      card.appendChild(meta);
      card.appendChild(link(x.title, x.link));
      box.appendChild(card);
    });
    if (all.length) box.appendChild(el('div', 'done', "✓ You're all caught up"));
    if (failed.length) box.appendChild(el('div', 'note', 'Failed: ' + failed.join(', ')));
  });
}

// ---------- Hacker News (Algolia API, no key needed) ----------
function loadHN() {
  var box = document.getElementById('hn');
  var since = Math.floor(Date.now() / 1000) - 3 * 86400;
  var filter = encodeURIComponent('created_at_i>' + since + ',points>30');
  var queries = ['AI agents', 'LLM'];
  Promise.all(queries.map(function (q) {
    return fetchJson('https://hn.algolia.com/api/v1/search?tags=story&hitsPerPage=10&query=' + encodeURIComponent(q) + '&numericFilters=' + filter)
      .then(function (j) { return j.hits || []; })
      .catch(function (err) { console.error('HN error for "' + q + '":', err); return null; });
  })).then(function (results) {
    box.innerHTML = '';
    if (results.every(function (r) { return r === null; })) {
      box.appendChild(el('div', 'note', 'Could not load Hacker News right now.'));
      return;
    }
    var seen = {};
    var hits = [].concat.apply([], results.map(function (r) { return r || []; })).filter(function (h) {
      if (seen[h.objectID]) return false;
      seen[h.objectID] = true; return true;
    }).sort(function (a, b) { return b.points - a.points; }).slice(0, 8);
    if (!hits.length) box.appendChild(el('div', 'note', 'No popular AI stories in the last 3 days.'));
    hits.forEach(function (h) {
      var hnUrl = 'https://news.ycombinator.com/item?id=' + h.objectID;
      var card = el('div', 'item');
      var meta = el('div', 'meta');
      meta.appendChild(el('span', 'tag hn', 'HN'));
      meta.appendChild(el('span', '', '▲ ' + h.points));
      meta.appendChild(link('💬 ' + (h.num_comments || 0) + ' comments', hnUrl));
      meta.appendChild(el('span', '', ageLabel(Date.now() - h.created_at_i * 1000)));
      card.appendChild(meta);
      card.appendChild(link(h.title, h.url || hnUrl));
      box.appendChild(card);
    });
    if (hits.length) box.appendChild(el('div', 'done', "✓ You're all caught up"));
  });
}

loadNews();
loadHN();
</script>
</body>
</html>
